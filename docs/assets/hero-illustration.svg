  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C2F8E4"/><stop offset="1" stop-color="#75D5BC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#54D5AF" stop-opacity=".22"/><stop offset="1" stop-color="#54D5AF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A2DCCA" stroke-opacity=".055"/></pattern>
  <filter id="shadow" x="-25%" y="-35%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="23" flood-color="#000" flood-opacity=".5"/></filter>
  <clipPath id="appClip"><rect x="648" y="105" width="550" height="409" rx="20"/></clipPath>
</defs>
