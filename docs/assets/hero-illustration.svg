<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">Personal Voice. Your voice. Your call.</title>
<desc id="desc">Illustrated Personal Voice desktop dictation and Android companion, using the application's mint and charcoal theme. This is a product illustration, not a screenshot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1319"/><stop offset=".56" stop-color="#111F27"/><stop offset="1" stop-color="#0A1017"/></linearGradient>
