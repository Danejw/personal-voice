name: Create Release Tag

on:
  create:

permissions:
  actions: write
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  tag:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-trigger/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0
      - name: Validate version, create tag, and start release
        env:
          RELEASE_BRANCH: ${{ github.event.ref }}
        run: |
          tag="${RELEASE_BRANCH#release-trigger/}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release branch $RELEASE_BRANCH doesn't match package.json version $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$(git rev-parse HEAD)"
          git push origin "$tag"
          gh workflow run release.yml --ref main -f tag="$tag"
