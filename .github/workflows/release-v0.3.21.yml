# One-time release kick-off for v0.3.21.
# This keeps the existing tag-triggered, signed Windows/Android release pipeline unchanged.
# Restricted to this exact version: later updates do not automatically publish.
name: Launch Personal Voice v0.3.21

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-v0.3.21.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: release-kickoff-v0.3.21
  cancel-in-progress: false

jobs:
  start_release:
    if: github.repository == 'Danejw/personal-voice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check exact version and matching Rust manifest
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "0.3.21" || { echo "::notice::One-time release version does not match, skipping."; exit 0; }
          grep -qx 'version = "0.3.21"' src-tauri/Cargo.toml
          echo "RELEASE_VERSION=0.3.21" >> "$GITHUB_ENV"
      - name: Tag current commit and dispatch signed release workflow
        if: env.RELEASE_VERSION == '0.3.21'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.3.21"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Refusing to overwrite or dispatch a duplicate release."
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$GITHUB_SHA"
          # GitHub Actions deliberately does not trigger tag-push workflows from
          # GITHUB_TOKEN. Explicit workflow_dispatch IS allowed and uses the
          # repository's existing, audited signing/publish pipeline.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f tag="$tag"
          echo "Dispatched existing Release workflow for $tag at $GITHUB_SHA"
