name: Spatial Windows Test Build

on:
  push:
    branches: [codex/3d-background]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "supabase/migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/spatial-windows-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned, isolated spatial test installer
        run: pnpm tauri build --config src-tauri/tauri.spatial-test.conf.json
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PersonalVoice-Spatial-Windows-Test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish experimental GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=(src-tauri/target/release/bundle/nsis/*.exe)
          if [[ ! -f "${installer[0]}" ]]; then
            echo "::error::No NSIS installer was built"
            exit 1
          fi
          short="${GITHUB_SHA:0:12}"
          tag="spatial-3d-${short}"
          mkdir -p spatial-release
          name="PersonalVoice-Spatial-Test-${short}-Setup.exe"
          cp "${installer[0]}" "spatial-release/${name}"
          (cd spatial-release && sha256sum "${name}" > SHA256SUMS.txt)
          cat > spatial-release/RELEASE_NOTES.md <<'NOTES'
          Experimental Windows-only Personal Voice 3D environment build from codex/3d-background.

          Installs alongside the normal Personal Voice app using a separate application identifier. This is not a stable release, and it does not change the main app or its auto-updater.

          Test the 3D desktop background, multi-monitor perspective, scene selection, and voice responsiveness. Account-owned environments require applying supabase/migrations/20261113000000_spatial_environments.sql first. Without the migration, the default local cyan terrain still works.

          Known limitations: only the terrain scene with cyan/violet/amber palettes is supported. World imports, agent interactions, and visual smoke testing are not complete. The Windows installer is not code-signed.
          NOTES
          gh release create "${tag}" \
            "spatial-release/${name}" \
            spatial-release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Personal Voice 3D Spatial Test (${short})" \
            --notes-file spatial-release/RELEASE_NOTES.md
