name: Spatial Windows Test Build

on:
  push:
    branches: [codex/3d-background]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "supabase/migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/spatial-windows-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned, isolated spatial test installer
        run: pnpm tauri build --config src-tauri/tauri.spatial-test.conf.json
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PersonalVoice-Spatial-Windows-Test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
